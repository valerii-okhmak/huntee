name: Build Production

on:
  push:
    branches: [ "test-ci" ]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Lowercase Owner
        run: echo "REPO_OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend Build & Push
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ env.REPO_OWNER }}/huntee-backend:latest

      - name: Save Backend to Tar
        run: |
          docker pull ghcr.io/${{ env.REPO_OWNER }}/huntee-backend:latest
          docker save -o backend.tar ghcr.io/${{ env.REPO_OWNER }}/huntee-backend:latest

      - name: Frontend Build & Push
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ env.REPO_OWNER }}/huntee-frontend:latest

      - name: Save Frontend to Tar
        run: |
          docker pull ghcr.io/${{ env.REPO_OWNER }}/huntee-frontend:latest
          docker save -o frontend.tar ghcr.io/${{ env.REPO_OWNER }}/huntee-frontend:latest

      - name: Upload Docker Images as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: |
            backend.tar
            frontend.tar
          retention-days: 1
name: Test Build & Push

on:
  push:
    branches: [ "test-ci" ] 
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  REAL_BACKEND_URL: http://localhost:8080 

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- BACKEND ---
      - name: Build and push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/huntee-backend:test 

      # --- FRONTEND ---
      - name: Build and push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/huntee-frontend:test
          build-args: |
            REACT_APP_BACKEND=${{ env.REAL_BACKEND_URL }}